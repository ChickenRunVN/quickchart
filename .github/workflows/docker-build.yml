name: Build and Publish Docker Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get version from package.json
        id: package_version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Image published as <DOCKERHUB_USERNAME>/quickchart. Set the
          # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/quickchart:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/quickchart:${{ steps.package_version.outputs.VERSION }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/quickchart:latest
          cache-to: type=inline
